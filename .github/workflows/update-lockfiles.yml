name: One-time dependency lockfile refresh

on:
  push:
    branches:
      - rebuild/architecture-foundation

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and verify audited dependency trees
        run: |
          (cd kiungo-api && npm audit fix --package-lock-only --ignore-scripts && npm audit --audit-level=moderate)
          (cd linkhub && npm audit fix --package-lock-only --ignore-scripts && npm audit --audit-level=moderate)
      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kiungo-api/package-lock.json linkhub/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh secure dependency lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Lockfiles are already current."
          fi
