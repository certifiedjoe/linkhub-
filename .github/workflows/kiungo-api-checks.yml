name: Kiungo API checks

permissions:
  contents: write

on:
  push:
    branches:
      - rebuild/architecture-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiungo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiungo-api/package-lock.json
      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: kiungo-api-lockfile
          path: kiungo-api/package-lock.json
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linkhub/package-lock.json
      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: linkhub-lockfile
          path: linkhub/package-lock.json
          if-no-files-found: error

  commit-security-lockfiles:
    if: github.event_name == 'push'
    needs: [api-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update and verify both dependency lockfiles
        run: |
          (cd kiungo-api && npm audit fix --package-lock-only --ignore-scripts && npm audit --audit-level=moderate)
          (cd linkhub && npm audit fix --package-lock-only --ignore-scripts && npm audit --audit-level=moderate)
      - name: Commit security updates to the rebuild branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kiungo-api/package-lock.json linkhub/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update audited dependency lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Dependency lockfiles are already current."
          fi
