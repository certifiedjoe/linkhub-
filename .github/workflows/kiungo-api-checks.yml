name: Kiungo API checks

on:
  push:
    branches:
      - rebuild/architecture-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiungo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiungo-api/package-lock.json
      - run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: kiungo-api-lockfile
          path: kiungo-api/package-lock.json
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linkhub/package-lock.json
      - run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: linkhub-lockfile
          path: linkhub/package-lock.json
          if-no-files-found: error
